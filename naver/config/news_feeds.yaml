# 뉴스 수집 설정
# - feeds: 자동으로 긁어올 RSS/API 목록 (아래 기본값 사용)
# - keywords_watch: 제목·본문에 이 단어가 있으면 우선순위 ↑ (알림 키워드)

categories:
  - entertainment   # 연예
  - tv_variety      # TV·예능
  - society         # 사회

feeds:
  # Google News RSS — API 키 불필요, 연예/TV예능/사회 각각
  - name: google_entertainment
    type: rss
    category: entertainment
    url: "https://news.google.com/rss/search?q=연예&hl=ko&gl=KR&ceid=KR:ko"
    max_items: 15

  - name: google_tv_variety
    type: rss
    category: tv_variety
    url: "https://news.google.com/rss/search?q=TV+예능+OR+예능+프로+OR+방송&hl=ko&gl=KR&ceid=KR:ko"
    max_items: 15

  - name: google_society
    type: rss
    category: society
    url: "https://news.google.com/rss/search?q=사회&hl=ko&gl=KR&ceid=KR:ko"
    max_items: 15

  # 네이버 뉴스 검색 API — NAVER_CLIENT_ID/SECRET 있을 때만 활성
  - name: naver_news_entertainment
    type: naver_news
    category: entertainment
    query: "연예"
    display: 10
    enabled: true

  - name: naver_news_tv
    type: naver_news
    category: tv_variety
    query: "TV 예능"
    display: 10
    enabled: true

  - name: naver_news_society
    type: naver_news
    category: society
    query: "사회"
    display: 10
    enabled: true

# 우선순위 키워드 (점수 +0.2씩, 최대 +1.0)
keywords_watch:
  - "나는솔로"
  - "드라마"
  - "예능"
  - "넷플릭스"
  - "방송"
  - "MC"
  - "아이돌"
  - "배우"
  - "가수"
  - "논란"
  - "속보"
  - "단독"

# 이 점수 미만이면 글 생성 대상에서 제외 (기본 수집 기사는 0.35)
min_score_to_generate: 0.25

# 기사 본문 가져올 때 타임아웃(초)
fetch_timeout: 15

# 요청 간격(초) — 서버 부하·차단 방지
request_delay: 0.8
